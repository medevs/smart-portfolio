name: Farm checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
